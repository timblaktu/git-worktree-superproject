[package]
name = "workspace-manager"
version.workspace = true
edition.workspace = true

[lib]
name = "workspace_manager"
path = "src/lib.rs"

[[bin]]
name = "workspace"
path = "src/main.rs"

[dependencies]
# Git operations
git2 = { workspace = true }
# CLI
clap = { workspace = true }
# Configuration and serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }
# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# File system operations
walkdir = { workspace = true }
dirs = { workspace = true }
# Integration with flake-input-modifier
flake-input-modifier = { path = "../flake-input-modifier" }
# Nix AST parsing (for flake generation)
rnix = { workspace = true }
rowan = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
mockall = "0.13"
rstest = "0.23"
proptest = "1.5"
assert_cmd = "2.0"
predicates = "3.1"
